<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Word fonts the Linux server doesn't have -> the closest free look-alike,
  so LibreOffice doesn't fall back to a random sans-serif.
  Install:  cp fonts-aliases.conf /etc/fonts/conf.d/60-filequik-aliases.conf && fc-cache -f
  (Chrome/Edge visitors send their real fonts inside the .docx anyway; this
  covers Firefox / Safari / phones.)
-->
<fontconfig>
  <alias binding="same"><family>Bookman Old Style</family><prefer><family>URW Bookman</family><family>TeX Gyre Bonum</family></prefer></alias>
  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family><family>TeX Gyre Adventor</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family><family>TeX Gyre Pagella</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family><family>TeX Gyre Pagella</family></prefer></alias>
  <alias binding="same"><family>Century</family><prefer><family>C059</family><family>TeX Gyre Schola</family></prefer></alias>
  <alias binding="same"><family>Century Schoolbook</family><prefer><family>C059</family><family>TeX Gyre Schola</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Open Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Franklin Gothic Medium</family><prefer><family>Libre Franklin</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Rockwell</family><prefer><family>Roboto Slab</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
