appId: in.filequik.desktop
productName: FileQuick
copyright: © FileQuick

directories:
  output: release
  buildResources: build

# The renderer is the pre-built Vite bundle (dist/); the main + preload are
# bundled by esbuild into electron-dist/ with electron-updater inlined. So the
# package carries NO node_modules — small and fast to build.
files:
  - dist/**/*
  - electron-dist/**/*
  - "!**/*.map"

extraMetadata:
  main: electron-dist/main.cjs

# The local conversion engine (Compress/Unlock/Protect PDF, PDF<->Word/PPT/Excel)
# — a PyInstaller-frozen exe built by scripts in the release workflow, at
# engine-dist/filequick-engine/. Lives in resources/engine/, not the asar,
# since it's a native binary tree, not JS. Skipped if the folder is absent
# (e.g. a local `electron:build` run without building the engine first).
extraResources:
  - from: engine-dist/filequick-engine
    to: engine

npmRebuild: false

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: FileQuick-Setup-${version}.${ext}

nsis:
  # oneClick is what makes auto-updates seamless: electron-updater's "Restart
  # now" re-runs this SAME installer silently. With oneClick:false (the old
  # setting) that installer is the multi-page "assisted" wizard — so restart
  # would open the full "Choose Installation Options" page again instead of
  # just relaunching the app. oneClick:true + perMachine:false installs to
  # the user's own AppData (no UAC prompt, ever) with a plain progress bar,
  # and every update after that is invisible: quit -> reinstall -> reopen.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # No code-signing certificate yet — Windows shows a one-time SmartScreen
  # prompt on first install. Add `certificateFile` / `certificatePassword`
  # (or a CI signing step) here once a cert is available.

# Auto-update feed. `electron-updater` reads the latest release here.
# releaseType "release" publishes it directly — electron-builder's default is
# a hidden draft that needs a manual "Publish" click on GitHub.
publish:
  provider: github
  owner: Rakeshkolpur
  repo: FileQuick
  releaseType: release
